<!DOCTYPE html>
<html lang="en">
<!--
========================================================
AI Learning Game - Main Entry Point
========================================================

This file is the starting point of the application.

It contains:
- The main structure of the user interface
- Containers for prompts, choices, feedback, and progress
- Links to CSS stylesheets
- Links to JavaScript modules that control the game logic

The page loads all components of the system and initializes the game.
========================================================
-->

<head>
  <meta charset="UTF-8">
  <title>YOU-AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/ui.css">
  <link rel="stylesheet" href="css/feedback.css">
</head>

<body>
  <!-- Home Screen -->
  <div id="homeScreen" class="screen active">
    <div class="home-container">
      <h1 class="home-title">You-AI</h1>
      <p class="home-subtitle">AI is not magic.<br> 
        You-AI, Do-AI.</p>
      <div class="scroll-indicator">↓</div>
    </div>
    <div class="role-box">
      <p>Here you will take the role of the AI</p>
    </div>
    <button class="home-start-button">Get Started</button>
  </div>

  <div id="answerModeScreen" class="screen">
    <div class="answer-mode-container">
      <div class="answer-mode-info">
        <p>Here you will choose in what way you would like to answer<br>the prompt and what type of answer you would like to give.</p>
      </div>
      <div class="answer-mode-grid">
        <div class="answer-mode-group" data-group="answer-mode">
          <h2>Answer mode</h2>
          <div class="answer-mode-row">
            <button class="answer-mode-button" data-value="own-knowledge">Own Knowledge</button>
            <button class="answer-mode-button" data-value="internet-search">Internet search</button>
          </div>
        </div>
        <div class="answer-mode-group" data-group="answer-type">
          <h2>Type of answer</h2>
          <div class="answer-mode-row">
            <button class="answer-mode-button" data-value="accurate-answer">Accurate Answer</button>
            <button class="answer-mode-button" data-value="fast-answer">Fast Answer</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Game Container -->
  <div id="gameContainer" class="screen">
    <!-- Game content will be rendered here -->
  </div>

  <!-- Scripts -->
  <script src="js/storage.js"></script>
  <script src="js/aiSimulation.js"></script>
  <script src="js/promptSystem.js"></script>
  <script src="js/feedbackSystem.js"></script>
  <script src="js/gameLogic.js"></script>
  <script src="js/main.js"></script>
  <script src="js/home.js"></script>
  <script src="js/answerModeSelection.js"></script>
</body>

</html>
